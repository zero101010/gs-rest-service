name: Deploying Application on AWS and pushing Dockerhub registry
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'complete/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Trigger manually'
        required: true
        default: 'true'

jobs:
  BUILD-AND-TEST:
    runs-on: ubuntu-latest
    steps:
    - name: Notify Slack on start
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {"text": "🔵 *Pipeline Started*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install dependencies
      working-directory: ./complete
      run: ./mvnw --batch-mode dependency:go-offline

    - name: Build and test
      working-directory: ./complete
      run: ./mvnw --batch-mode package

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: complete/target/rest-service-complete-*.jar
        retention-days: 1

    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {"text": "🔴 *BUILD-AND-TEST failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  PUSH-DOCKER-IMAGE:
    runs-on: ubuntu-latest
    needs: BUILD-AND-TEST
    steps:
    - uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Rename JAR to app.jar
      run: mv target/rest-service-complete-*.jar target/app.jar

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: false
        load: true
        tags: docker.io/zero101010/gs-rest-service:${{ github.sha }}
        context: .
        file: Dockerfile.deploy

    - name: Docker Scout CVEs
      uses: docker/scout-action@v1
      with:
        command: cves
        image: docker.io/zero101010/gs-rest-service:${{ github.sha }}
        only-severities: critical
        exit-code: true

    - name: Push image
      run: docker push docker.io/zero101010/gs-rest-service:${{ github.sha }}

    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {"text": "🔴 *PUSH-DOCKER-IMAGE failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  RUN-ON-EC2:
    runs-on: ubuntu-latest
    needs: PUSH-DOCKER-IMAGE
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Run command on EC2 via SSM
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "i-007b49fed78f8ec04" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["docker stop $(docker ps -aq)", "docker run -d -p 777:777 docker.io/zero101010/gs-rest-service:${{ github.sha }}" ]' \
          --query "Command.CommandId" \
          --output text)

        echo "Waiting for command to complete..."
        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "i-007b49fed78f8ec04" || true

        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-007b49fed78f8ec04" \
          --query "StatusDetails" --output text)

        OUTPUT=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-007b49fed78f8ec04" \
          --query "StandardOutputContent" --output text)

        ERROR=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "i-007b49fed78f8ec04" \
          --query "StandardErrorContent" --output text)

        echo "=== STDOUT ===" && echo "$OUTPUT"
        echo "=== STDERR ===" && echo "$ERROR"

        if [ "$STATUS" != "Success" ]; then
          echo "SSM command failed with status: $STATUS"
          exit 1
        fi

    - name: Notify Slack on failure
      if: failure()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {"text": "🔴 *Pipeline Failed*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Notify Slack on Success
      if: success()
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {"text": "🟢 *Pipeline Finished Successfully*\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
