name: Deploying Application on AWS and pushing Dockerhub registry
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Trigger manually'     
        required: true
        default: 'true'

jobs:
  PUSH-DOCKER-IMAGE:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build image
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: false
        load: true
        tags: docker.io/zero101010/gs-rest-service:${{ github.sha }}
        context: .
        file: Dockerfile

    - name: Docker Scout CVEs
      uses: docker/scout-action@v1
      with:
        command: cves
        image: docker.io/zero101010/gs-rest-service:${{ github.sha }}
        only-severities: critical,high
        exit-code: true

    - name: Push image
      run: docker push docker.io/zero101010/gs-rest-service:${{ github.sha }}